[package]
name = "deadlock_macro"
version = "2.0.0"
edition = "2021"
authors = ["Velgoh <nicko.aviyuda@gmail.com>"]
description = "Deadlock Macro Desktop Application"

[lib]
name = "deadlock_macro"
path = "src/lib.rs"

[[bin]]
name = "DeadlockMacro"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["gif", "png"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
rand = "0.8"
chrono = "0.4"
